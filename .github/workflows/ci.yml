name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements-dev.txt pulls in requirements.txt plus pytest/httpx
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
